global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.rules.yml"

scrape_configs:
  - job_name: "nexus-game-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:4000"]
        labels:
          tier: "backend"

  - job_name: "nexus-ai-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-engine:8000"]
        labels:
          tier: "ai"
