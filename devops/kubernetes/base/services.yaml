apiVersion: v1
kind: Service
metadata:
  name: game-backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: game-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-engine-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: ai-engine
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
