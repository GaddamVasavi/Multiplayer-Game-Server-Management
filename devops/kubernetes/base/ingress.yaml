apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "game-backend-service"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "NEXUS_SERVER_STICKY"
spec:
  rules:
    - host: nexus-arena.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: game-backend-service
                port:
                  number: 4000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: game-backend-service
                port:
                  number: 4000
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: ai-engine-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
