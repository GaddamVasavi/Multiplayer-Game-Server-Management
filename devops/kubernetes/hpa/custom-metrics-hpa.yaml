apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: game-backend-ai-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: game-backend-deployment
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: predicted_player_traffic
        target:
          type: Value
          averageValue: "50"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
