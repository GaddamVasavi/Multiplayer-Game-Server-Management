replicaCount:
  backend: 2
  ai: 1
  frontend: 2

image:
  repository: registry.nexus-arena.internal
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  backendPort: 4000
  aiPort: 8000
  frontendPort: 80

ingress:
  enabled: true
  className: "nginx"
  host: "nexus-arena.internal"

resources:
  backend:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  ai:
    limits:
      cpu: 2000m
      memory: 1024Mi
    requests:
      cpu: 300m
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
